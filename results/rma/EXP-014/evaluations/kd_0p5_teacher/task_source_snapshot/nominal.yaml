# @package _global_
# Evaluation-only reference. Never selected by the training CLI by default.
env:
  observations:
    policy:
      enable_corruption: false
  events:
    reset_root_state_uniform:
      params:
        pose_range:
          x: [0.0, 0.0]
          y: [0.0, 0.0]
          z: [0.0, 0.0]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [0.0, 0.0]
        velocity_range:
          x: [0.0, 0.0]
          y: [0.0, 0.0]
          z: [0.0, 0.0]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [0.0, 0.0]
    pd_gains:
      params:
        kp_range: [35.0, 35.0]
        kd_range: [0.0, 0.0]
    rma_friction:
      params:
        ranges: [1.0, 1.0]
    rma_base_load:
      params:
        mass_distribution_params: [0.0, 0.0]
